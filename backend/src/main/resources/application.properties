spring.application.name=backend

# Database Configuration (H2 In-Memory Database used for out-of-the-box local running)
spring.datasource.url=jdbc:h2:mem:interviewiq;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# MySQL Configuration (Uncomment to use real MySQL server)
# spring.datasource.url=jdbc:mysql://localhost:3306/interviewiq?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:interviewiq-super-secret-jwt-token-key-change-in-production-2025}
jwt.expiration=86400000

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:local-test-key}

# Razorpay Configuration (optional for direct UPI)
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_dummy}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:dummy_secret}

# CORS Configuration
cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}
